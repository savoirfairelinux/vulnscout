name: Publish Docker Hub image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build from
        required: true
        type: string
      publish_latest:
        description: Also push :latest
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: sflinux/vulnscout
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push multi-arch image
        run: |
          TAGS="-t ${IMAGE_NAME}:${IMAGE_TAG}"
          PUBLISH_LATEST="${{ inputs.publish_latest }}"

          if [ "${{ github.event_name }}" = "push" ] && [[ "${IMAGE_TAG}" != *beta* ]]; then
            PUBLISH_LATEST="true"
          fi

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAGS="${TAGS} -t ${IMAGE_NAME}:latest"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VULNSCOUT_VERSION=${IMAGE_TAG} \
            ${TAGS} \
            --push .
