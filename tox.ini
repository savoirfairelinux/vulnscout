[flake8]
# E722 : do not use bare 'except' ; W503 is deprecated
ignore = E722, W503
max-line-length = 120
exclude = src/migrations/versions
per-file-ignores =
    __init__.py:F401

[coverage:run]
omit =
    */migrations/env.py

[mypy]
files = src
mypy_path = tests/mypy_stubs

# Third-party libraries without type stubs
[mypy-spdx_tools.*]
ignore_missing_imports = true

[mypy-cyclonedx.*]
ignore_missing_imports = true

[mypy-packageurl.*]
ignore_missing_imports = true

[mypy-uuid_extensions]
ignore_missing_imports = true

# ── Per-module ratchet (added phase by phase) ──────────────────────────────
# Phase 1a: helpers

[mypy-src.helpers.env_vars]
disallow_untyped_defs = true
disallow_incomplete_defs = true

