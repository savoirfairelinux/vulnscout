<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">VulnScout architecture</title>
  <desc id="architecture-description">The host CLI invokes the container entrypoint, while the React browser interface calls the Flask API. Both use shared core services, scanning and enrichment, and host-backed storage. The embedded Agent uses the GitHub Copilot SDK and runtime, communicates with an AI provider, and invokes the bundled MCP server over stdio. MCP tools call the Flask REST API. Optional external MCP clients use a bundled launcher on their own host.</desc>
